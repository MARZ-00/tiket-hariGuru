<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://db.onlinewebfonts.com/c/3c1a4128f95e2109303b045eda4bfe8a?family=Etna" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js" defer></script>
    <title>MUTTAQIN STARWAYS - Ticket Scanner</title>
</head>
<body>
<div class="container scanner-container">
    <div class="galaxy-header">
        <h1>✨ STARWAYS SCANNER ✨</h1>
        <p class="subtitle">Gate Validation Terminal</p>
    </div>

    <div class="scanner-wrapper">
        <div id="reader"></div>
    </div>

    <div id="scan-result" class="result-card hidden">
        <h3>🚀 Passenger Cleared</h3>
        <div class="result-data">
            <p><strong>Name:</strong> <span id="scanned-name">-</span></p>
            <p><strong>Seat:</strong> <span id="scanned-seat">-</span></p>
        </div>
        <button onclick="resetScanner()" class="generate-btn reset-btn">Scan Next Ticket</button>
    </div>
</div>
</body>
</html>
